
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">

    <title>Settings | LocalLink</title>

    <link rel="icon" type="image/svg+xml"
          href="../../assets/favicon.svg">
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/pages/Setting/style.css">
    <link rel="stylesheet" href="../../styles/components/header.css">
    <link rel="stylesheet" href="../../styles/components/page-heading.css">
</head>

<body>
    <header id="header-container" class="header"></header>

    <main class="setting-page">
        <section class="page-header">
            <button class="back-btn" type="button"
                    onclick="history.back()" aria-label="Go back">
                <img src="../../assets/back-btn.svg"
                     alt="" width="20" height="20">
            </button>
            <h1>Settings</h1>
        </section>

        <!-- Profile Settings -->
        <section class="settings-card" aria-labelledby="profile-title">
            <div class="section-icon profile-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21v-2a8 8 0 0 1 16 0v2z"/>
                </svg>
            </div>

            <div class="card-content">
                <h2 id="profile-title">Profile</h2>
                <div class="form-group">
                    <label for="profile-name">Your name</label>
                    <input
                        type="text"
                        id="profile-name"
                        name="profile-name"
                        maxlength="32"
                        autocomplete="nickname"
                        placeholder="Enter your name"
                        required
                    >
                    <div class="input-footer">
                        <span id="profile-error" role="alert"></span>
                        <span class="char-count" id="char-count">0/32</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Appearance Settings -->
        <section class="settings-card"
                 aria-labelledby="appearance-title">
            <div class="section-icon appearance-icon"
                 aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3a9 9 0 1 0 0 18h2a2 2 0 0 0 1.5-3.3
                             1.5 1.5 0 0 1 1.1-2.5H19a2 2 0 0 0 2-2
                             10 10 0 0 0-9-10.2Z"/>
                    <circle cx="7.5" cy="10" r="1"/>
                    <circle cx="11" cy="6.5" r="1"/>
                    <circle cx="16" cy="8" r="1"/>
                </svg>
            </div>

            <div class="card-content">
                <h2 id="appearance-title">Appearance</h2>

                <div class="setting-row">
                    <label class="setting-label" for="theme-select">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="4"/>
                            <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42
                                     m11.3 11.3 1.42 1.42M2 12h2m16 0h2
                                     M4.93 19.07l1.42-1.42m11.3-11.3
                                     1.42-1.42"/>
                        </svg>
                        <span>Theme</span>
                    </label>

                    <select id="theme-select" name="theme">
                        <option value="system">System</option>
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                    </select>
                </div>

                <div class="setting-row">
                    <label class="setting-label" for="language-select">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M2 12h20M12 2a15 15 0 0 1 0 20
                                     M12 2a15 15 0 0 0 0 20"/>
                        </svg>
                        <span>Language</span>
                    </label>

                    <select id="language-select" name="language">
                        <option value="en">English</option>
                        <option value="hi">हिन्दी</option>
                        <option value="es">Español</option>
                        <option value="fr">Français</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Storage Settings -->
        <section class="settings-card" aria-labelledby="storage-title">
            <div class="section-icon storage-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <ellipse cx="12" cy="5" rx="9" ry="3"/>
                    <path d="M3 5v6c0 1.7 4 3 9 3s9-1.3 9-3V5"/>
                    <path d="M3 11v6c0 1.7 4 3 9 3s9-1.3 9-3v-6"/>
                </svg>
            </div>

            <div class="card-content">
                <h2 id="storage-title">Storage</h2>

                <div class="setting-row storage-row">
                    <label class="setting-label" for="clear-after">
                        Auto clear files after
                    </label>

                    <select id="clear-after" name="clear-after">
                        <option value="never">Never</option>
                        <option value="1">1 hour</option>
                        <option value="24" selected>24 hours</option>
                        <option value="72">3 days</option>
                        <option value="168">7 days</option>
                    </select>
                </div>

                <p class="helper-text">
                    Files received in this room will be automatically
                    removed after the selected duration.
                </p>
            </div>
        </section>

        <p class="save-status" id="save-status"
           role="status" aria-live="polite"></p>
    </main>

    <script src="../../scripts/components/header.js"></script>
    <script src="../../scripts/pages/Setting/setting.js"></script>
</body>
</html>
