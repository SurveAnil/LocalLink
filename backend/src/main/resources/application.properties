spring.application.name=locallink
server.port=8080
# Local development is the default. Override with SPRING_PROFILES_ACTIVE=cloud in deployment.
spring.profiles.default=local

# Validate schema against Flyway-managed migrations; do not let Hibernate mutate it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Multipart request limits are safeguards for APIs, not the transfer-chunk protocol.
spring.servlet.multipart.max-file-size=${LOCALLINK_MAX_FILE_SIZE:2GB}
spring.servlet.multipart.max-request-size=${LOCALLINK_MAX_REQUEST_SIZE:2050MB}
spring.servlet.multipart.file-size-threshold=0B

# Files are stored outside the database, under the backend working directory.
locallink.files.storage-directory=${LOCALLINK_FILE_STORAGE:./data/files}
locallink.files.max-size-bytes=${LOCALLINK_MAX_FILE_SIZE_BYTES:2147483648}
# Sweep metadata and payloads for rooms that have expired; active room files are retained.
locallink.files.cleanup-cron=${LOCALLINK_FILE_CLEANUP_CRON:0 15 3 * * *}
locallink.realtime.presence-check-ms=${LOCALLINK_PRESENCE_CHECK_MS:5000}
locallink.cors.allowed-origin-patterns=${LOCALLINK_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://192.168.*.*:*,http://10.*.*.*:*,http://172.*.*.*:*,https://localhost:5500,https://127.0.0.1:5500,https://192.168.*.*:*,https://10.*.*.*:*,https://172.*.*.*:*}
