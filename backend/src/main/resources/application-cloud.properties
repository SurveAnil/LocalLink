# Supply these environment variables in the cloud deployment environment.
# Set DB_URL or the individual DB_HOST, DB_PORT, and DB_NAME variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:locallink}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.h2.console.enabled=false
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Do not log SQL or credentials in production.
spring.jpa.show-sql=false
